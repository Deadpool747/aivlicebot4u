<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · BOT4U</title><link rel="stylesheet" href="style.css"><script src="login.js" defer></script></head><body><main style="max-width:460px;padding-top:12vh"><header><span class="brand">BOT4U</span></header><section class="setup"><div style="display:flex;gap:12px;margin-bottom:20px"><button type="button" id="signInTab" aria-pressed="true">Sign in</button><button type="button" id="signUpTab" class="quiet" aria-pressed="false">Sign up</button><input id="loggedInUser" class="account-name" type="text" readonly aria-label="Signed-in username" placeholder="Not signed in"></div><h1 id="title" style="font-size:30px">Welcome back</h1><p id="intro">Sign in to your voice assistant.</p><form id="loginForm" style="flex-direction:column"><label for="username">Username</label><input id="username" autocomplete="username" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9_.\-]+"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"><div id="confirmField" hidden><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" style="width:100%;margin-top:8px"></div><p id="hint">Use at least 12 characters.</p><button id="submit" disabled>Sign in</button></form><p id="feedback" role="alert"></p></section></main></body></html>
