<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | AI Voice Bot 4 U</title>
    <meta name="description" content="Create your AI Voice Bot 4 U account and start automating voice workflows." />
    <meta name="robots" content="noindex,follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/static/premium-theme.css" />
    <style>
      :root {
        --bg-1: #07111f;
        --bg-2: #101b30;
        --surface: rgba(10, 20, 36, 0.84);
        --line: rgba(148, 163, 184, 0.22);
        --text: #f8fafc;
        --muted: #9fb0c8;
        --brand: #34d399;
        --brand-strong: #10b981;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 8% 10%, rgba(52, 211, 153, 0.14), transparent 30%),
          radial-gradient(circle at 90% 14%, rgba(125, 211, 252, 0.14), transparent 24%),
          linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 100%);
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      .card {
        width: min(540px, 100%);
        border-radius: 24px;
        border: 1px solid var(--line);
        background: var(--surface);
        backdrop-filter: blur(12px);
        box-shadow: 0 24px 80px rgba(2, 6, 23, 0.46);
        padding: 1.35rem;
        display: grid;
        gap: 1rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        text-decoration: none;
        color: inherit;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        background: linear-gradient(135deg, var(--brand), #7dd3fc);
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        object-fit: cover;
        display: block;
      }

      h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 0.85rem;
      }

      label {
        font-size: 0.9rem;
        font-weight: 700;
      }

      .field {
        display: grid;
        gap: 0.4rem;
      }

      .input-wrap {
        position: relative;
      }

      .input-wrap i {
        position: absolute;
        left: 0.78rem;
        top: 50%;
        transform: translateY(-50%);
        color: #7e95b3;
      }

      input {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 0.78rem 0.85rem 0.78rem 2.35rem;
        font: inherit;
        color: var(--text);
        background: rgba(8, 17, 31, 0.84);
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      input:focus {
        outline: none;
        border-color: rgba(125, 211, 252, 0.5);
        box-shadow: 0 0 0 4px rgba(125, 211, 252, 0.14);
      }

      .btn {
        border: 0;
        border-radius: 999px;
        padding: 0.82rem;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        color: #03211a;
        background: linear-gradient(135deg, var(--brand), #2dd4bf);
      }

      .btn:hover {
        background: linear-gradient(135deg, var(--brand-strong), #14b8a6);
      }

      .error {
        color: #fecaca;
        font-weight: 700;
        min-height: 1.2rem;
      }

      .foot {
        text-align: center;
        font-size: 0.92rem;
      }

      .foot a {
        color: #bbf7d0;
        text-decoration: none;
        font-weight: 700;
      }

      .hint {
        font-size: 0.86rem;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="signup-title">
      <a href="/" class="brand" aria-label="Go to AI Voice Bot 4 U landing page"><span class="brand-mark" aria-hidden="true"><img src="/logo.png" alt="AI Voice Bot 4 U logo" loading="eager" /></span>AI Voice Bot 4 U</a>
      <header>
        <h1 id="signup-title">Create your account</h1>
        <p>Set up your protected workspace and start voice automation in minutes.</p>
      </header>
      <form id="signupForm" novalidate>
        <div class="field">
          <label for="name">Full Name</label>
          <div class="input-wrap"><i class="bi bi-person"></i><input id="name" name="name" type="text" autocomplete="name" required /></div>
        </div>
        <div class="field">
          <label for="email">Work Email</label>
          <div class="input-wrap"><i class="bi bi-envelope"></i><input id="email" name="email" type="email" autocomplete="email" required /></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap"><i class="bi bi-lock"></i><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required /></div>
          <p class="hint">Use at least 8 characters.</p>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrap"><i class="bi bi-shield-lock"></i><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required /></div>
        </div>
        <p class="error" id="errorText" role="alert" aria-live="polite"></p>
        <button class="btn" id="submitBtn" type="submit"><i class="bi bi-person-plus"></i> Create Account</button>
      </form>
      <div class="foot">Already have an account? <a id="loginLink" href="/login">Login</a></div>
    </main>

    <script>
      const form = document.getElementById("signupForm");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const errorText = document.getElementById("errorText");
      const submitBtn = document.getElementById("submitBtn");
      const loginLink = document.getElementById("loginLink");
      const nextParam = new URLSearchParams(window.location.search).get("next");
      const startDemoFlag = (() => {
        try {
          return window.sessionStorage.getItem("start_demo") === "1";
        } catch (error) {
          return false;
        }
      })();

      function addStartDemoParam(path) {
        if (!startDemoFlag || !path.startsWith("/")) {
          return path;
        }
        const url = new URL(path, window.location.origin);
        if (!url.searchParams.get("start_demo")) {
          url.searchParams.set("start_demo", "1");
        }
        return `${url.pathname}${url.search}${url.hash}`;
      }

      function resolveNextPath() {
        if (!nextParam) return addStartDemoParam("/app");
        if (!nextParam.startsWith("/")) return addStartDemoParam("/app");
        if (nextParam.startsWith("//")) return addStartDemoParam("/app");
        return addStartDemoParam(nextParam);
      }

      if (loginLink && nextParam) {
        loginLink.href = `/login?next=${encodeURIComponent(nextParam)}`;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorText.textContent = "";

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (name.length < 2) {
          errorText.textContent = "Please enter your full name.";
          return;
        }
        if (!email || !email.includes("@")) {
          errorText.textContent = "Enter a valid email address.";
          return;
        }
        if (password.length < 8) {
          errorText.textContent = "Password must be at least 8 characters.";
          return;
        }
        if (password !== confirmPassword) {
          errorText.textContent = "Passwords do not match.";
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account...";

        try {
          const response = await fetch("/api/auth/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            errorText.textContent = data.detail || "Unable to create account.";
            return;
          }
          window.location.href = resolveNextPath();
        } catch (err) {
          errorText.textContent = "Network error. Please try again.";
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-person-plus"></i> Create Account';
        }
      });
    </script>
  </body>
</html>
