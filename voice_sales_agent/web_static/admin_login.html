<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | AI Voice Bot 4 U</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #09121b;
        --bg-2: #122033;
        --surface: rgba(10, 20, 34, 0.86);
        --line: rgba(148, 163, 184, 0.22);
        --ink: #f8fafc;
        --muted: #a8b8cc;
        --accent: #f59e0b;
        --accent-2: #f97316;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px;
        color: var(--ink);
        font-family: "Manrope", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(249, 115, 22, 0.18), transparent 25%),
          radial-gradient(circle at bottom right, rgba(245, 158, 11, 0.16), transparent 28%),
          linear-gradient(145deg, var(--bg) 0%, var(--bg-2) 100%);
      }

      .card {
        width: min(480px, 100%);
        display: grid;
        gap: 18px;
        padding: 24px;
        border-radius: 26px;
        border: 1px solid var(--line);
        background: var(--surface);
        backdrop-filter: blur(12px);
        box-shadow: 0 30px 90px rgba(2, 6, 23, 0.45);
      }

      .eyebrow {
        display: inline-flex;
        width: fit-content;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: rgba(245, 158, 11, 0.14);
        color: #fde68a;
      }

      h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(2rem, 4vw, 2.5rem);
        line-height: 1.02;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 13px 14px;
        font: inherit;
        color: var(--ink);
        background: rgba(4, 10, 18, 0.72);
      }

      input:focus {
        outline: none;
        border-color: rgba(245, 158, 11, 0.58);
        box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 13px 16px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        color: #1c1102;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }

      .error {
        min-height: 1.3rem;
        color: #fecaca;
        font-weight: 700;
      }

      .footer {
        font-size: 14px;
      }

      .footer a {
        color: #fdba74;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">Admin Access</span>
      <header>
        <h1>Lead Review Console</h1>
        <p>Sign in with admin credentials to review guest-demo leads, testing summaries, and Excel exports.</p>
      </header>

      <form id="loginForm" novalidate>
        <label for="email">
          Admin email
          <input id="email" name="email" type="email" autocomplete="email" required />
        </label>
        <label for="password">
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required />
        </label>
        <p class="error" id="errorText" role="alert" aria-live="polite"></p>
        <button id="submitBtn" type="submit">Open Admin Dashboard</button>
      </form>

      <p class="footer"><a href="/">Back to website</a></p>
    </main>

    <script>
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const errorText = document.getElementById("errorText");
      const submitBtn = document.getElementById("submitBtn");

      async function ensureAdminSession() {
        const response = await fetch("/api/auth/me", { credentials: "same-origin" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.user || data.user.is_admin !== "1") {
          await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }).catch(() => null);
          throw new Error("These credentials do not have admin access.");
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorText.textContent = "";
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !email.includes("@")) {
          errorText.textContent = "Enter a valid email address.";
          return;
        }
        if (!password || password.length < 8) {
          errorText.textContent = "Password must be at least 8 characters.";
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Checking access...";
        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            errorText.textContent = data.detail || "Unable to login.";
            return;
          }
          await ensureAdminSession();
          window.location.href = "/admin/leads";
        } catch (error) {
          errorText.textContent = error instanceof Error ? error.message : "Network error. Please try again.";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Open Admin Dashboard";
        }
      });
    </script>
  </body>
</html>
